<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proteção 2FA | L&A Royal SaaS</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><main class="auth-wrap"><div class="brand">L&A <span>ROYAL</span></div><section class="card" style="margin-top:24px"><div class="eyebrow">Segurança da conta</div><h1 id="title">Quer ativar a verificação em duas etapas?</h1><p id="description" style="color:#b9bec8;line-height:1.6">Recomendamos proteger sua empresa com um aplicativo autenticador. Além da senha, será solicitado um código temporário ao entrar.</p><div id="status" class="status"></div><div id="choice" class="nav-actions"><button id="enable" class="btn primary">Sim, ativar 2FA</button><button id="skip" class="btn">Agora não</button></div><div id="enroll" class="security-box hidden"><h3>Escaneie o QR Code</h3><img id="qr" class="qr" alt="QR Code 2FA"><p>Ou use esta chave:</p><code id="secret"></code><div class="field" style="margin-top:16px"><label>Código de 6 dígitos</label><input id="code" inputmode="numeric" maxlength="6" placeholder="000000"></div><br><button id="confirm" class="btn primary">Confirmar e ativar</button></div></section></main><script type="module">import{getSession,getMyProfile,enrollTotp,verifyTotpEnrollment,declineOptionalMfa,setMfaPreference}from'../assets/js/auth.js';if(!await getSession())location.href='../auth/login.html';const profile=await getMyProfile(),required=profile?.is_platform_super_admin===true||new URLSearchParams(location.search).get('required')==='1';let factorId=null;const s=document.querySelector('#status'),choice=document.querySelector('#choice'),enroll=document.querySelector('#enroll'),skip=document.querySelector('#skip');const msg=(t,e=false)=>{s.textContent=t;s.className='status show '+(e?'error':'ok')};if(required){document.querySelector('#title').textContent='Ative a verificação em duas etapas';document.querySelector('#description').textContent='O 2FA é obrigatório para contas Super Admin. Configure um aplicativo autenticador para continuar.';skip.classList.add('hidden')}const next=()=>location.href=required?'../super-admin/index.html':'../app/plano.html';enable.addEventListener('click',async()=>{try{const data=await enrollTotp('L&A Royal - Principal');factorId=data.id;qr.src=data.totp.qr_code;secret.textContent=data.totp.secret;choice.classList.add('hidden');enroll.classList.remove('hidden')}catch(err){msg(err.message||'Não foi possível iniciar o 2FA.',true)}});confirm.addEventListener('click',async()=>{try{if(!factorId)throw new Error('Inicie a configuração do 2FA.');await verifyTotpEnrollment(factorId,code.value.trim());await setMfaPreference('enabled');msg('2FA ativado com sucesso.');setTimeout(next,500)}catch(err){msg(err.message||'Código inválido.',true)}});skip.addEventListener('click',async()=>{try{if(required)throw new Error('2FA obrigatório para Super Admin.');await declineOptionalMfa();next()}catch(err){msg(err.message||'Não foi possível continuar.',true)}});</script></body></html>
