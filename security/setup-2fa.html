<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proteção 2FA | L&A Royal SaaS</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><main class="auth-wrap"><div class="brand">L&A <span>ROYAL</span></div><section class="card" style="margin-top:24px"><div class="eyebrow">Segurança da conta</div><h1>Quer ativar a verificação em duas etapas?</h1><p style="color:#b9bec8;line-height:1.6">Recomendamos proteger sua empresa com um aplicativo autenticador. Além da senha, será solicitado um código temporário ao entrar.</p><div id="status" class="status"></div><div id="choice" class="nav-actions"><button id="enable" class="btn primary">Sim, ativar 2FA</button><button id="skip" class="btn">Agora não</button></div><div id="enroll" class="security-box hidden"><h3>Escaneie o QR Code</h3><img id="qr" class="qr" alt="QR Code 2FA"><p>Ou use esta chave:</p><code id="secret"></code><div class="field" style="margin-top:16px"><label>Código de 6 dígitos</label><input id="code" inputmode="numeric" maxlength="6" placeholder="000000"></div><br><button id="confirm" class="btn primary">Confirmar e ativar</button></div></section></main><script type="module">import{getSession,enrollTotp,verifyTotpEnrollment,declineOptionalMfa}from'../assets/js/auth.js';if(!await getSession())location.href='../auth/login.html';let factorId=null;const s=document.querySelector('#status'),choice=document.querySelector('#choice'),enroll=document.querySelector('#enroll');const msg=(t,e=false)=>{s.textContent=t;s.className='status show '+(e?'error':'ok')};const next=()=>location.href='../app/plano.html';enable.addEventListener('click',async()=>{try{const data=await enrollTotp('L&A Royal - Principal');factorId=data.id;qr.src=data.totp.qr_code;secret.textContent=data.totp.secret;choice.classList.add('hidden');enroll.classList.remove('hidden')}catch(err){msg(err.message||'Não foi possível iniciar o 2FA.',true)}});confirm.addEventListener('click',async()=>{try{await verifyTotpEnrollment(factorId,code.value.trim());msg('2FA ativado com sucesso. Agora escolha seu plano.');setTimeout(next,700)}catch(err){msg(err.message||'Código inválido.',true)}});skip.addEventListener('click',async()=>{try{await declineOptionalMfa();next()}catch(err){msg(err.message||'Não foi possível continuar.',true)}});</script></body></html>
