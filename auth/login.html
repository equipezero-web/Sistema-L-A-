<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | L&A Royal SaaS</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><main class="auth-wrap"><a href="../index.html" class="brand">L&A <span>ROYAL</span></a><section class="card" style="margin-top:24px"><div class="eyebrow">Acesso seguro</div><h1>Entrar</h1><div id="status" class="status"></div><form id="loginForm"><div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="email"></div><br><div class="field"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"></div><br><button class="btn primary" type="submit">Entrar</button></form><section id="mfaBox" class="security-box hidden"><h3>Verificação em duas etapas</h3><p>Digite o código do seu aplicativo autenticador.</p><div class="field"><input id="mfaCode" inputmode="numeric" maxlength="6" placeholder="000000"></div><br><button id="verifyMfa" class="btn primary">Verificar</button></section><p style="color:#9da3af">Ainda não possui conta? <a style="color:#f1d477" href="cadastro.html">Criar empresa</a></p></section></main><script type="module">import{signIn,getAAL,listMfaFactors,challengeTotp,getMyProfile}from'../assets/js/auth.js';const s=document.querySelector('#status'),box=document.querySelector('#mfaBox'),form=document.querySelector('#loginForm');let factor=null,superAdmin=false;const msg=(t,e=false)=>{s.textContent=t;s.className='status show '+(e?'error':'ok')};async function destination(){const profile=await getMyProfile();superAdmin=profile?.is_platform_super_admin===true;return superAdmin?'../super-admin/index.html':'../app/index.html'}async function route(){const target=await destination(),aal=await getAAL();if(superAdmin&&aal.currentLevel!=='aal2'){const fs=await listMfaFactors();factor=fs.totp?.find(x=>x.status==='verified')||null;if(!factor){location.href='../security/setup-2fa.html?required=1';return}box.classList.remove('hidden');form.classList.add('hidden');msg('Confirme o 2FA obrigatório para acessar o Super Admin.');return}if(aal.currentLevel==='aal1'&&aal.nextLevel==='aal2'){const fs=await listMfaFactors();factor=fs.totp?.find(x=>x.status==='verified')||fs.totp?.[0];if(factor){box.classList.remove('hidden');form.classList.add('hidden');return}}location.href=target}form.addEventListener('submit',async e=>{e.preventDefault();try{const{error}=await signIn(email.value.trim(),password.value);if(error)throw error;await route()}catch(err){msg(err.message||'Falha no login.',true)}});verifyMfa.addEventListener('click',async()=>{try{if(!factor)throw new Error('Fator 2FA não encontrado.');await challengeTotp(factor.id,mfaCode.value.trim());location.href=await destination()}catch(err){msg(err.message||'Código inválido.',true)}});</script></body></html>
