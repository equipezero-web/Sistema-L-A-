<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar acesso | L&A Royal SaaS</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><main class="auth-wrap"><a href="./login.html" class="back">← Entrar</a><section class="card"><h1>Recuperação de senha</h1><p class="muted">Enviaremos um link ao e-mail vinculado à sua conta. Não compartilhe o código recebido.</p><div id="status" class="status" role="status" aria-live="polite"></div><form id="requestForm"><label class="field">E-mail da conta<input type="email" id="recoveryEmail" required autocomplete="email"></label><button type="submit" class="btn primary" style="margin-top:14px">Enviar link de recuperação</button></form><form id="resetForm" hidden><label class="field">Nova senha<input type="password" id="newPassword" required minlength="12" maxlength="72" autocomplete="new-password"></label><p class="muted">Use pelo menos 12 caracteres, maiúscula, minúscula e número.</p><button type="submit" class="btn primary">Alterar minha senha</button></form></section></main><script type="module" src="../assets/js/password-recovery.js"></script></body></html>
