<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | L&A Royal SaaS</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><main class="auth-wrap"><a href="../index.html" class="brand">L&A <span>ROYAL</span></a><section class="card" style="margin-top:24px"><div class="eyebrow">Conta do proprietário</div><h1>Comece sua empresa</h1><p style="color:#aeb4bf">O primeiro usuário será o Owner da empresa.</p><div id="status" class="status"></div><form id="signupForm" class="form-grid"><div class="field full"><label>Nome completo</label><input id="fullName" required autocomplete="name"></div><div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Telefone</label><input id="phone" type="tel" required autocomplete="tel"></div><div class="field"><label>Senha</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirmar senha</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></div><div class="field full"><button class="btn primary" type="submit">Criar conta</button></div></form><p style="color:#9da3af">Já possui conta? <a style="color:#f1d477" href="login.html">Entrar</a></p></section></main><script type="module">import{signUpOwner}from'../assets/js/auth.js';const f=document.querySelector('#signupForm'),s=document.querySelector('#status');const msg=(t,e=false)=>{s.textContent=t;s.className='status show '+(e?'error':'ok')};f.addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirmPassword.value)return msg('As senhas não coincidem.',true);try{const{data,error}=await signUpOwner({fullName:fullName.value.trim(),email:email.value.trim(),phone:phone.value.trim(),password:password.value});if(error)throw error;if(!data.session){msg('Conta criada. Confirme seu e-mail para continuar com a criação da empresa.');return}location.href='../onboarding/index.html'}catch(err){msg(err.message||'Não foi possível criar sua conta.',true)}});</script></body></html>
