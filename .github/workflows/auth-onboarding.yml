name: Authentication and onboarding — no real accounts

on:
  pull_request:
    paths:
      - 'assets/js/app.js'
      - 'assets/js/business.js'
      - 'app/index.html'
      - 'auth/**'
      - 'security/**'
      - 'onboarding/**'
      - 'tests/auth-*.test.mjs'
      - 'supabase/sql/saas_first_login_onboarding_access.sql'
  push:
    branches: [main]
    paths:
      - 'assets/js/app.js'
      - 'auth/**'
      - 'security/**'
      - 'onboarding/**'
      - 'tests/auth-*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Login and onboarding offline tests
        run: node --test tests/auth-first-login.test.mjs tests/auth-inline-syntax.test.mjs tests/auth-email-totp.test.mjs tests/auth-verified-factor.test.mjs tests/auth-onboarding-guard.test.mjs tests/auth-dashboard-permissions.test.mjs tests/auth-role-session-guards.test.mjs
      - name: Public GitHub Pages HTTP check (diagnostic only)
        continue-on-error: true
        run: |
          set -eu
          base="https://equipezero-web.github.io/Sistema-L-A-"
          for path in "/" "/auth/login.html" "/security/setup-2fa.html" "/assets/js/auth.js"; do
            output="$(mktemp)"
            code="$(curl -L -sS --connect-timeout 8 --max-time 25 -o "$output" -w '%{http_code}' "$base$path")"
            echo "PAGES_CHECK $path HTTP $code"
            test "$code" = "200"
            test -s "$output"
            rm -f "$output"
          done
