name: SaaS verified-auth and HTTP harness
on:
  pull_request:
    paths:
      - 'assets/js/auth.js'
      - 'assets/js/app.js'
      - 'assets/js/super-admin.js'
      - 'scripts/verify-tenant-http.mjs'
      - 'tests/auth-verified-user-http-harness.test.mjs'
      - 'tests/tenant-http-fixtures.test.mjs'
      - 'tests/super-admin-mfa-http.test.mjs'
      - 'scripts/verify-super-admin-mfa-http.mjs'
      - '.github/workflows/auth-verified-http-harness.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/auth.js'
      - 'assets/js/app.js'
      - 'assets/js/super-admin.js'
      - 'scripts/verify-tenant-http.mjs'
      - 'tests/auth-verified-user-http-harness.test.mjs'
      - 'tests/tenant-http-fixtures.test.mjs'
      - 'tests/super-admin-mfa-http.test.mjs'
      - 'scripts/verify-super-admin-mfa-http.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auth and module offline regression tests
        run: node --test tests/super-admin-mfa-http.test.mjs tests/tenant-http-fixtures.test.mjs tests/auth-verified-user-http-harness.test.mjs tests/auth-role-session-guards.test.mjs tests/auth-dashboard-permissions.test.mjs tests/saas-privileged-rpc-wrappers.test.mjs
      - name: Syntax check for opt-in HTTP harness
        run: node --check scripts/verify-tenant-http.mjs && node --check scripts/verify-super-admin-mfa-http.mjs
