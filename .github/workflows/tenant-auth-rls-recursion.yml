name: Tenant RLS recursion and isolation
on:
  pull_request:
    paths:
      - 'supabase/sql/saas_platform_admin_rls_recursion_fix.sql'
      - 'tests/tenant-auth-rls-recursion.test.mjs'
      - '.github/workflows/tenant-auth-rls-recursion.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/sql/saas_platform_admin_rls_recursion_fix.sql'
      - 'tests/tenant-auth-rls-recursion.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tenant-auth-rls-recursion.test.mjs tests/tenant-relational-integrity.test.mjs tests/auth-role-session-guards.test.mjs
