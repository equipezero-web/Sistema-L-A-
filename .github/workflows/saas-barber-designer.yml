name: SaaS Barber Full Designer
on:
  pull_request:
    paths:
      - 'supabase/sql/saas_barber_full_designer_65.sql'
      - 'app/aparencia.html'
      - 'assets/js/appearance-designer.js'
      - 'assets/js/barber-original-template.js'
      - 'store/barbearia.html'
      - 'tests/saas-barber-designer.test.mjs'
      - '.github/workflows/saas-barber-designer.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/sql/saas_barber_full_designer_65.sql'
      - 'app/aparencia.html'
      - 'assets/js/appearance-designer.js'
      - 'assets/js/barber-original-template.js'
      - 'store/barbearia.html'
      - 'tests/saas-barber-designer.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  designer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/saas-barber-designer.test.mjs tests/saas-original-barber-template.test.mjs tests/saas-public-store-loading.test.mjs
