name: SaaS Super Admin MFA HTTP verification
on:
  pull_request:
    paths:
      - 'scripts/verify-super-admin-mfa-http.mjs'
      - 'tests/super-admin-mfa-http.test.mjs'
      - '.github/workflows/super-admin-mfa-http.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-super-admin-mfa-http.mjs'
      - 'tests/super-admin-mfa-http.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mfa-http-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulated token assurance and tenant authorization tests
        run: node --test tests/super-admin-mfa-http.test.mjs tests/tenant-http-fixtures.test.mjs tests/auth-verified-user-http-harness.test.mjs
      - name: Syntax check of opt-in HTTP tester
        run: node --check scripts/verify-super-admin-mfa-http.mjs
