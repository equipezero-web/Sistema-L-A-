name: SaaS Merchant Token Refresh
on:
  pull_request:
    paths:
      - 'supabase/sql/saas_merchant_token_refresh_20261116.sql'
      - 'supabase/functions/saas-merchant-refresh/index.ts'
      - 'app/pagamentos-loja.html'
      - 'tests/saas-merchant-token-refresh.test.mjs'
      - 'scripts/verify-saas-merchant-refresh-http.mjs'
      - '.github/workflows/saas-merchant-token-refresh.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/sql/saas_merchant_token_refresh_20261116.sql'
      - 'supabase/functions/saas-merchant-refresh/index.ts'
      - 'app/pagamentos-loja.html'
      - 'tests/saas-merchant-token-refresh.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merchant-token-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/saas-merchant-token-refresh.test.mjs tests/saas-merchant-oauth.test.mjs tests/saas-merchant-oauth-disconnect.test.mjs
      - run: node scripts/verify-saas-merchant-refresh-http.mjs
