name: SaaS Virtual Store Public Experience
on:
  pull_request:
    paths:
      - 'store/index.html'
      - 'store/loja-virtual.html'
      - 'assets/js/virtual-storefront.js'
      - 'tests/saas-public-store-loading.test.mjs'
      - 'tests/saas-virtual-store.test.mjs'
      - '.github/workflows/saas-virtual-store.yml'
  push:
    branches: [main]
    paths:
      - 'store/index.html'
      - 'store/loja-virtual.html'
      - 'assets/js/virtual-storefront.js'
      - 'tests/saas-virtual-store.test.mjs'
      - 'tests/saas-public-store-loading.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  virtual-store:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public tenant experience and safe cart regression
        run: node --test tests/saas-virtual-store.test.mjs tests/saas-public-store-loading.test.mjs
