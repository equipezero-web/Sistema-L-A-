name: SaaS public storefront loader
on:
  pull_request:
    paths:
      - 'store/index.html'
      - 'tests/saas-public-store-loading.test.mjs'
      - '.github/workflows/saas-public-store-loading.yml'
  push:
    branches: [main]
    paths:
      - 'store/index.html'
      - 'tests/saas-public-store-loading.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-store:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public catalog loader
        run: node --test tests/saas-public-store-loading.test.mjs
