name: Merchant OAuth Security and Isolation
on:
  pull_request:
    paths:
      - 'app/pagamentos-loja.html'
      - 'supabase/functions/saas-merchant-oauth/index.ts'
      - 'supabase/sql/saas_merchant_oauth_20261116.sql'
      - 'supabase/sql/saas_merchant_oauth_disconnect_20261116.sql'
      - 'tests/saas-merchant-oauth-disconnect.test.mjs'
      - 'tests/saas-merchant-oauth.test.mjs'
      - 'scripts/verify-saas-merchant-oauth-http.mjs'
      - '.github/workflows/saas-merchant-oauth.yml'
  push:
    branches: [main]
    paths:
      - 'app/pagamentos-loja.html'
      - 'supabase/functions/saas-merchant-oauth/index.ts'
      - 'supabase/sql/saas_merchant_oauth_20261116.sql'
      - 'tests/saas-merchant-oauth.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/saas-merchant-oauth.test.mjs tests/saas-merchant-oauth-disconnect.test.mjs tests/saas-merchant-payment-readiness.test.mjs
      - run: node scripts/verify-saas-merchant-oauth-http.mjs
