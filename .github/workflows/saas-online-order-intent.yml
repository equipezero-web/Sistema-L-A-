name: SaaS Online Order Intent Security
on:
  pull_request:
    paths:
      - 'supabase/sql/saas_online_order_intents_20261116.sql'
      - 'tests/saas-online-order-intent.test.mjs'
      - '.github/workflows/saas-online-order-intent.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/sql/saas_online_order_intents_20261116.sql'
      - 'tests/saas-online-order-intent.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/saas-online-order-intent.test.mjs tests/saas-virtual-store.test.mjs tests/saas-merchant-token-refresh.test.mjs
