<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar empresa | L&A Royal SaaS</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><main class="onboarding-wrap"><div class="brand">L&A <span>ROYAL</span></div><div class="steps"><div class="step active"></div><div class="step active"></div><div class="step"></div></div><section class="card"><div class="eyebrow">Configuração empresarial</div><h1>Crie a identidade da sua empresa</h1><p class="muted">Você pode configurar e visualizar sua identidade. A publicação da loja é liberada após ativar o plano Royal 30 de R$ 30/mês.</p><div id="status" class="status"></div><form id="companyForm" class="form-grid"><div class="field full"><label>Nome da empresa</label><input id="companyName" required></div><div class="field"><label>Endereço público (slug)</label><input id="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" minlength="3" maxlength="63" placeholder="minha-empresa"></div><div class="field"><label>Segmento</label><input id="businessType" required placeholder="Ex.: Barbearia"></div><div class="field full"><label>O que sua empresa oferece?</label><select id="businessMode"><option value="products">Produtos</option><option value="services">Serviços</option><option value="products_services">Produtos + Serviços</option></select></div><div class="field"><label>Cor principal</label><input id="primaryColor" type="color" value="#d4af37"></div><div class="field"><label>Cor secundária</label><input id="secondaryColor" type="color" value="#f1d477"></div><div class="field"><label>Fundo</label><input id="backgroundColor" type="color" value="#08090c"></div><div class="field"><label>Texto</label><input id="textColor" type="color" value="#f8fafc"></div><div class="field"><label>Fonte</label><select id="fontStyle"><option>Inter</option><option>Poppins</option><option>Montserrat</option><option>Playfair Display</option><option>Roboto</option><option>Lato</option></select></div><div class="field"><label>Layout</label><select id="layoutId"><option value="royal-classic">Royal Classic</option><option value="royal-modern">Royal Modern</option><option value="royal-minimal">Royal Minimal</option></select></div><div class="field full"><button id="createCompany" class="btn primary" type="submit" disabled>Verificando acesso...</button></div></form></section></main><script type="module">
import { getSession } from '../assets/js/auth.js';
import { supabase } from '../assets/js/supabase.js';

const $ = selector => document.querySelector(selector);
const status = $('#status');
const companyForm = $('#companyForm');
const createCompany = $('#createCompany');
const companyName = $('#companyName');
const slug = $('#slug');
const businessType = $('#businessType');
const businessMode = $('#businessMode');
const primaryColor = $('#primaryColor');
const secondaryColor = $('#secondaryColor');
const backgroundColor = $('#backgroundColor');
const textColor = $('#textColor');
const fontStyle = $('#fontStyle');
const layoutId = $('#layoutId');
let ready = false;
let submitting = false;
let slugEdited = false;

function msg(text, error = false) {
  status.textContent = text;
  status.className = 'status show ' + (error ? 'error' : 'ok');
}

function preventSubmission() {
  ready = false;
  createCompany.disabled = true;
}

async function checkOnboardingAccess() {
  preventSubmission();
  const session = await getSession();
  if (!session) {
    location.replace('../auth/login.html');
    return;
  }
  const { data: access, error } = await supabase.rpc('saas_my_access_summary');
  if (error) throw error;
  if (!access || typeof access !== 'object') throw new Error('Não foi possível confirmar o acesso da conta.');
  if (access.is_platform_super_admin === true) {
    location.replace('../super-admin/index.html');
    return;
  }
  if (access.has_any_membership === true || access.has_owned_tenant === true) {
    location.replace('../app/index.html');
    return;
  }
  if (access.has_any_membership !== false || access.has_owned_tenant !== false) {
    throw new Error('Não foi possível verificar se esta conta já possui empresa.');
  }
  ready = true;
  createCompany.disabled = false;
  createCompany.textContent = 'Criar minha empresa';
}

companyName.addEventListener('input', () => {
  if (slugEdited) return;
  slug.value = companyName.value.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 63);
});
slug.addEventListener('input', () => { slugEdited = true; });

companyForm.addEventListener('submit', async event => {
  event.preventDefault();
  if (!ready || submitting) return;
  submitting = true;
  createCompany.disabled = true;
  createCompany.textContent = 'Criando empresa...';
  try {
    // Revalidate to stop reuse of a stale onboarding page after another tab creates a tenant.
    const session = await getSession();
    if (!session) {
      preventSubmission();
      location.replace('../auth/login.html');
      return;
    }
    const { data: access, error: accessError } = await supabase.rpc('saas_my_access_summary');
    if (accessError) throw accessError;
    if (!access || access.has_any_membership !== false || access.has_owned_tenant !== false || access.is_platform_super_admin === true) {
      preventSubmission();
      location.replace('../app/index.html');
      return;
    }
    const { data, error } = await supabase.rpc('saas_onboard_company', {
      p_name: companyName.value.trim(),
      p_slug: slug.value.trim(),
      p_business_mode: businessMode.value,
      p_business_type: businessType.value.trim(),
      p_logo_url: null,
      p_primary_color: primaryColor.value,
      p_secondary_color: secondaryColor.value,
      p_background_color: backgroundColor.value,
      p_text_color: textColor.value,
      p_font_style: fontStyle.value,
      p_layout_id: layoutId.value,
      p_publish: false
    });
    if (error) throw error;
    sessionStorage.setItem('royal_tenant_id', typeof data === 'string' ? data : (data?.id || data?.tenant_id || ''));
    preventSubmission();
    location.replace('../security/setup-2fa.html');
  } catch (error) {
    msg(error.message || 'Não foi possível criar a empresa.', true);
    if (ready) {
      createCompany.disabled = false;
      createCompany.textContent = 'Criar minha empresa';
    }
  } finally {
    submitting = false;
  }
});

void checkOnboardingAccess().catch(error => {
  preventSubmission();
  msg(error.message || 'Falha ao verificar acesso. Atualize a página e tente novamente.', true);
});
</script></body></html>
