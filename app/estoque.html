<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estoque | L&A Royal</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><div class="module-shell"><header class="module-head"><div><a href="./index.html" class="back">← Painel</a><div class="eyebrow">Operação</div><h1>Estoque</h1><p id="company" class="muted"></p></div></header><div id="status" class="status"></div><section class="metric-grid" id="metrics"></section><section class="card"><div class="toolbar"><input id="search" placeholder="Buscar produto ou SKU"><select id="stockFilter"><option value="all">Todos</option><option value="low">Estoque baixo (≤ 5)</option><option value="zero">Sem estoque</option></select></div><div class="table-wrap"><table><thead><tr><th>Produto</th><th>SKU</th><th>Quantidade</th><th>Valor em custo</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="card section-gap"><h2>Movimentações recentes</h2><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Alteração</th><th>Motivo</th><th>Data</th></tr></thead><tbody id="moves"></tbody></table></div></section></div><dialog id="modal" class="royal-modal"><form id="form" class="modal-card"><div class="modal-title"><h2>Ajustar estoque</h2><button type="button" class="icon-btn" id="close">×</button></div><p id="productName" class="muted"></p><input type="hidden" id="productId"><div class="field"><label>Quantidade (+ entrada / - saída)</label><input id="delta" type="number" step="1" required></div><div class="field"><label>Motivo</label><input id="reason" maxlength="160" required placeholder="Ex.: compra de fornecedor, correção, perda"></div><div class="modal-actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Confirmar movimentação</button></div></form></dialog><script type="module">import{getBusinessContext,listProducts,listInventoryMovements,adjustInventory}from'../assets/js/business.js';let ctx,products=[],movements=[];const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=(t,e=false)=>{status.textContent=t;status.className='status show '+(e?'error':'ok')};try{ctx=await getBusinessContext();company.textContent=ctx.tenant.name;await load()}catch(e){msg(e.message,true)}async function load(){[products,movements]=await Promise.all([listProducts(ctx.tenant.id),listInventoryMovements(ctx.tenant.id)]);render()}function render(){const total=products.reduce((a,p)=>a+p.stock_quantity,0),value=products.reduce((a,p)=>a+(Number(p.cost||0)*p.stock_quantity),0),low=products.filter(p=>p.stock_quantity<=5).length;metrics.innerHTML=`<article class="metric"><span>Unidades</span><strong>${total}</strong></article><article class="metric"><span>Valor em custo</span><strong>${money(value)}</strong></article><article class="metric"><span>Estoque baixo</span><strong>${low}</strong></article>`;const q=search.value.toLowerCase(),f=stockFilter.value;const list=products.filter(p=>`${p.name} ${p.sku||''}`.toLowerCase().includes(q)&&(f==='all'||(f==='low'&&p.stock_quantity<=5)||(f==='zero'&&p.stock_quantity===0)));rows.innerHTML=list.length?list.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.sku||'—')}</td><td><strong>${p.stock_quantity}</strong></td><td>${money(Number(p.cost||0)*p.stock_quantity)}</td><td>${ctx.canManage?`<button class="mini" data-adjust="${p.id}">Ajustar</button>`:''}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Nenhum produto encontrado.</td></tr>';moves.innerHTML=movements.length?movements.map(m=>`<tr><td>${esc(m.saas_products?.name||'Produto')}</td><td class="${m.quantity_delta>0?'positive':'negative'}">${m.quantity_delta>0?'+':''}${m.quantity_delta}</td><td>${esc(m.reason)}</td><td>${new Date(m.created_at).toLocaleString('pt-BR')}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Nenhuma movimentação registrada.</td></tr>'}search.oninput=stockFilter.onchange=render;rows.onclick=e=>{const pid=e.target.dataset.adjust;if(!pid)return;const p=products.find(x=>x.id===pid);productId.value=pid;productName.textContent=`${p.name} • estoque atual: ${p.stock_quantity}`;delta.value='';reason.value='';modal.showModal()};close.onclick=cancel.onclick=()=>modal.close();form.onsubmit=async e=>{e.preventDefault();try{await adjustInventory(productId.value,delta.value,reason.value);modal.close();msg('Estoque atualizado e movimentação registrada.');await load()}catch(x){msg(x.message,true)}};</script></body></html>
