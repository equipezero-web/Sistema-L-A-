<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos | L&A Royal</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><div class="module-shell"><header class="module-head"><div><a href="./index.html" class="back">← Painel</a><div class="eyebrow">Operação</div><h1>Produtos</h1><p id="company" class="muted"></p></div><button id="newBtn" class="btn primary">+ Novo produto</button></header><div id="status" class="status"></div><section class="card"><div class="toolbar"><input id="search" placeholder="Buscar por nome ou SKU"><select id="filter"><option value="all">Todos</option><option value="active">Ativos</option><option value="inactive">Inativos</option><option value="archived">Arquivados</option></select></div><div class="table-wrap"><table><thead><tr><th>Produto</th><th>SKU</th><th>Preço</th><th>Estoque</th><th>Loja</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></div><dialog id="modal" class="royal-modal"><form id="form" class="modal-card"><div class="modal-title"><h2 id="modalTitle">Novo produto</h2><button type="button" class="icon-btn" id="close">×</button></div><input type="hidden" id="id"><input type="hidden" id="image"><div class="form-grid"><div class="field"><label>Nome</label><input id="name" required></div><div class="field"><label>SKU</label><input id="sku"></div><div class="field"><label>Preço</label><input id="price" type="number" min="0" step="0.01" required></div><div class="field"><label>Custo</label><input id="cost" type="number" min="0" step="0.01"></div><div class="field"><label>Estoque inicial</label><input id="stock" type="number" min="0" step="1" value="0"></div><div class="field"><label>Status</label><select id="productStatus"><option value="active">Ativo</option><option value="inactive">Inativo</option></select></div><div class="field full"><label>Imagem do produto</label><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"><small>PNG, JPG ou WEBP. Máximo 5 MB.</small><img id="imagePreview" alt="Prévia" style="display:none;max-width:140px;max-height:110px;object-fit:contain;margin-top:10px"></div><div class="field full"><label><input id="published" type="checkbox" style="width:auto"> Publicar este produto na loja</label></div><div class="field full"><label>Descrição</label><textarea id="description"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" type="submit">Salvar produto</button></div></form></dialog><script type="module">import{getBusinessContext,listProducts,saveProduct,archiveProduct,setProductPublished,uploadTenantAsset}from'../assets/js/business.js';let ctx,items=[];const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const msg=(t,e=false)=>{status.textContent=t;status.className='status show '+(e?'error':'ok')};try{ctx=await getBusinessContext();company.textContent=ctx.tenant.name;if(!ctx.canManage)newBtn.classList.add('hidden');await load()}catch(e){msg(e.message,true)}async function load(){items=await listProducts(ctx.tenant.id);render()}function render(){const q=search.value.toLowerCase(),f=filter.value;const list=items.filter(x=>(f==='all'||x.status===f)&&(`${x.name} ${x.sku||''}`.toLowerCase().includes(q)));rows.innerHTML=list.length?list.map(x=>`<tr><td><strong>${esc(x.name)}</strong><small>${esc(x.description||'')}</small></td><td>${esc(x.sku||'—')}</td><td>${money(x.price)}</td><td>${x.stock_quantity}</td><td>${ctx.canManage?`<button class="mini" data-publish="${x.id}" data-value="${!x.published}">${x.published?'Publicada':'Privada'}</button>`:(x.published?'Publicada':'Privada')}</td><td><span class="pill">${x.status}</span></td><td>${ctx.canManage?`<button class="mini" data-edit="${x.id}">Editar</button> <button class="mini danger" data-archive="${x.id}">Arquivar</button>`:''}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">Nenhum produto encontrado.</td></tr>'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showImage(u){imagePreview.style.display=u?'block':'none';if(u)imagePreview.src=u}function open(p={}){form.reset();id.value=p.id||'';name.value=p.name||'';sku.value=p.sku||'';price.value=p.price??'';cost.value=p.cost??'';stock.value=p.stock_quantity??0;stock.disabled=!!p.id;image.value=p.image_url||'';description.value=p.description||'';published.checked=!!p.published;productStatus.value=p.status==='inactive'?'inactive':'active';showImage(p.image_url);modalTitle.textContent=p.id?'Editar produto':'Novo produto';modal.showModal()}newBtn.onclick=()=>open();close.onclick=cancel.onclick=()=>modal.close();search.oninput=filter.onchange=render;imageFile.onchange=()=>{const f=imageFile.files[0];if(f)showImage(URL.createObjectURL(f))};rows.onclick=async e=>{const edit=e.target.dataset.edit,arc=e.target.dataset.archive,pub=e.target.dataset.publish;if(edit)open(items.find(x=>x.id===edit));if(pub){try{await setProductPublished(ctx.tenant.id,pub,e.target.dataset.value==='true');msg('Publicação atualizada.');await load()}catch(x){msg(x.message,true)}}if(arc&&confirm('Arquivar este produto?')){try{await archiveProduct(ctx.tenant.id,arc);msg('Produto arquivado.');await load()}catch(x){msg(x.message,true)}}};form.onsubmit=async e=>{e.preventDefault();const b=e.submitter;try{b.disabled=true;b.textContent='Salvando...';let url=image.value||null;if(imageFile.files[0]){msg('Enviando imagem...');url=await uploadTenantAsset(ctx.tenant.id,imageFile.files[0],'products')}await saveProduct(ctx.tenant.id,{id:id.value||null,name:name.value,sku:sku.value,price:price.value,cost:cost.value,stock_quantity:stock.value,image_url:url,description:description.value,status:productStatus.value,published:published.checked});modal.close();msg('Produto salvo com sucesso.');await load()}catch(x){msg(x.message,true)}finally{b.disabled=false;b.textContent='Salvar produto'}};</script></body></html>
