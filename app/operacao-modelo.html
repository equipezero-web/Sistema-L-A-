<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operação empresarial | L&A Royal SaaS</title><link rel="stylesheet" href="../assets/css/main.css"><style>.model-ops{width:min(1040px,calc(100% - 20px));margin:26px auto}.model-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}.model-ticket{padding:16px;border:1px solid var(--line);border-radius:14px;overflow-wrap:anywhere}.model-ticket h3{margin:0 0 9px}.model-ticket p{color:var(--muted)}.model-ticket small{color:var(--muted)}.model-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.model-form .full{grid-column:1/-1}@media(max-width:600px){.model-form{grid-template-columns:1fr}.model-ops{margin:10px auto}.model-form button{width:100%}}</style></head><body><main class="model-ops"><header class="module-head"><div><a class="back" href="./central.html">← Central operacional</a><div class="eyebrow">Modelo empresarial</div><h1 id="headline">Carregando operação...</h1><p class="muted" id="company"></p></div></header><div id="status" role="status" aria-live="polite" class="status"></div>
<section class="card"><h2>Nova atividade</h2><p class="muted" id="hint"></p><form id="workForm" class="model-form" hidden>
<label class="field full">Título<input name="title" required minlength="4" maxlength="120" placeholder="Descreva o trabalho"></label>
<label class="field full">Descrição<textarea name="details" maxlength="2000" rows="3"></textarea></label>
<label class="field">Prioridade<select name="priority"><option value="normal">Normal</option><option value="high">Alta</option><option value="low">Baixa</option></select></label>
<label class="field">Prazo<input name="due_on" type="date"></label>
<button class="btn primary full" type="submit">Registrar atividade</button></form></section>
<section class="card" style="margin-top:18px"><div class="card-head"><h2>Atividades da empresa</h2><button id="reload" class="btn" type="button">Atualizar</button></div><div class="model-list" id="items"></div></section>
</main><script type="module" src="../assets/js/model-workflow.js"></script></body></html>
