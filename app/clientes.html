<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes | L&A Royal</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><div class="module-shell"><header class="module-head"><div><a href="./index.html" class="back">← Painel</a><div class="eyebrow">Relacionamento</div><h1>Clientes</h1><p id="company" class="muted"></p></div><button id="newBtn" class="btn primary">+ Novo cliente</button></header><div id="status" class="status"></div><section class="card"><div class="toolbar"><input id="search" placeholder="Buscar por nome, email ou telefone"><select id="filter"><option value="all">Todos</option><option value="active">Ativos</option><option value="inactive">Inativos</option><option value="archived">Arquivados</option></select></div><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Contato</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></div><dialog id="modal" class="royal-modal"><form id="form" class="modal-card"><div class="modal-title"><h2 id="title">Novo cliente</h2><button type="button" id="close" class="icon-btn">×</button></div><input type="hidden" id="id"><div class="form-grid"><div class="field"><label>Nome</label><input id="name" required></div><div class="field"><label>Telefone</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Status</label><select id="customerStatus"><option value="active">Ativo</option><option value="inactive">Inativo</option></select></div><div class="field full"><label>Observações</label><textarea id="notes"></textarea></div></div><div class="modal-actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Salvar cliente</button></div></form></dialog><script type="module">import{getBusinessContext,listCustomers,saveCustomer,archiveCustomer}from'../assets/js/business.js';let ctx,items=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),msg=(t,e=false)=>{status.textContent=t;status.className='status show '+(e?'error':'ok')};try{ctx=await getBusinessContext();company.textContent=ctx.tenant.name;if(!ctx.canManage)newBtn.classList.add('hidden');await load()}catch(e){msg(e.message,true)}async function load(){items=await listCustomers(ctx.tenant.id);render()}function render(){const q=search.value.toLowerCase(),f=filter.value,list=items.filter(x=>(f==='all'||x.status===f)&&`${x.name} ${x.email||''} ${x.phone||''}`.toLowerCase().includes(q));rows.innerHTML=list.length?list.map(x=>`<tr><td><strong>${esc(x.name)}</strong><small>${esc(x.notes||'')}</small></td><td>${esc(x.phone||'—')}<small>${esc(x.email||'')}</small></td><td><span class="pill">${x.status}</span></td><td>${ctx.canManage?`<button class="mini" data-edit="${x.id}">Editar</button> <button class="mini danger" data-archive="${x.id}">Arquivar</button>`:''}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Nenhum cliente encontrado.</td></tr>'}function open(x={}){form.reset();id.value=x.id||'';name.value=x.name||'';phone.value=x.phone||'';email.value=x.email||'';notes.value=x.notes||'';customerStatus.value=x.status==='inactive'?'inactive':'active';title.textContent=x.id?'Editar cliente':'Novo cliente';modal.showModal()}newBtn.onclick=()=>open();close.onclick=cancel.onclick=()=>modal.close();search.oninput=filter.onchange=render;rows.onclick=async e=>{const edit=e.target.dataset.edit,arc=e.target.dataset.archive;if(edit)open(items.find(x=>x.id===edit));if(arc&&confirm('Arquivar este cliente?')){try{await archiveCustomer(ctx.tenant.id,arc);msg('Cliente arquivado.');await load()}catch(x){msg(x.message,true)}}};form.onsubmit=async e=>{e.preventDefault();try{await saveCustomer(ctx.tenant.id,{id:id.value||null,name:name.value,phone:phone.value,email:email.value,notes:notes.value,status:customerStatus.value});modal.close();msg('Cliente salvo com sucesso.');await load()}catch(x){msg(x.message,true)}};</script></body></html>
