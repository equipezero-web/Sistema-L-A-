<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatórios | L&A Royal</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><div class="module-shell"><header class="module-head"><div><a href="./index.html" class="back">← Painel</a><div class="eyebrow">Inteligência empresarial</div><h1>Relatórios</h1><p id="company" class="muted"></p></div><div class="toolbar"><input id="from" type="date"><input id="to" type="date"><button id="refresh" class="btn primary">Atualizar</button></div></header><div id="status" class="status"></div><section class="metric-grid"><article class="metric-card"><span>Receitas</span><strong id="income">R$ 0,00</strong></article><article class="metric-card"><span>Despesas</span><strong id="expense">R$ 0,00</strong></article><article class="metric-card"><span>Saldo</span><strong id="balance">R$ 0,00</strong></article><article class="metric-card"><span>Clientes ativos</span><strong id="customers">0</strong></article></section><section class="dash-grid"><article class="dash-card"><div class="eyebrow">Vendas</div><h2 id="orders">0 pedidos</h2><p id="completedOrders" class="muted">0 concluídos</p></article><article class="dash-card"><div class="eyebrow">Agenda</div><h2 id="appointments">0 agendamentos</h2><p id="completedAppointments" class="muted">0 concluídos</p></article><article class="dash-card"><div class="eyebrow">Estoque</div><h2 id="lowStock">0 itens em atenção</h2><p class="muted">Produtos ativos com até 5 unidades.</p></article></section></div><script type="module">import{supabase}from'../assets/js/supabase.js';import{getBusinessContext}from'../assets/js/business.js';const $=s=>document.querySelector(s),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let ctx;const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1);from.value=first.toISOString().slice(0,10);to.value=now.toISOString().slice(0,10);function msg(t,e=false){status.textContent=t;status.className='status show '+(e?'error':'ok')}async function load(){try{ctx=ctx||await getBusinessContext();company.textContent=ctx.tenant.name;const{data,error}=await supabase.rpc('saas_report_summary',{p_tenant_id:ctx.tenant.id,p_from:from.value,p_to:to.value});if(error)throw error;income.textContent=money(data.income);expense.textContent=money(data.expense);balance.textContent=money(Number(data.income)-Number(data.expense));customers.textContent=data.customers;orders.textContent=`${data.orders} pedido(s)`;completedOrders.textContent=`${data.completed_orders} concluído(s)`;appointments.textContent=`${data.appointments} agendamento(s)`;completedAppointments.textContent=`${data.completed_appointments} concluído(s)`;lowStock.textContent=`${data.low_stock} item(ns) em atenção`;msg('Relatório atualizado.')}catch(e){msg(e.message,true)}}refresh.onclick=load;load();</script></body></html>
