<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro | L&A Royal</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><main class="auth-wrap" style="max-width:1100px"><a href="./" class="eyebrow">← Painel</a><div class="card"><div class="card-head"><div><div class="eyebrow">Gestão</div><h1>Financeiro</h1></div><button id="newBtn" class="btn primary">Novo lançamento</button></div><div id="status" class="status"></div><section class="metric-grid" style="margin:18px 0"><article class="metric-card"><span>Receitas</span><strong id="income">R$ 0,00</strong></article><article class="metric-card"><span>Despesas</span><strong id="expense">R$ 0,00</strong></article><article class="metric-card"><span>Saldo</span><strong id="balance">R$ 0,00</strong></article></section><div id="formBox" class="hidden"><form id="form" class="form-grid"><div class="field"><label>Tipo</label><select id="kind"><option value="income">Receita</option><option value="expense">Despesa</option></select></div><div class="field"><label>Valor</label><input id="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Descrição</label><input id="description" required></div><div class="field"><label>Categoria</label><input id="category"></div><div class="field"><label>Data</label><input id="date" type="date" required></div><div class="field"><button class="btn primary" style="margin-top:22px">Salvar</button></div></form></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Origem</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script type="module" src="../assets/js/financeiro.js"></script></body></html>
