<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM Empresarial | L&A Royal</title><link rel="stylesheet" href="../assets/css/main.css"><style>.crm-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}.crm-list{display:grid;gap:10px}.crm-list button{text-align:left;white-space:normal}.crm-msg{padding:12px;border-radius:12px;border:1px solid var(--line);margin:10px 0;overflow-wrap:anywhere}@media(max-width:780px){.crm-layout{grid-template-columns:1fr}}</style></head><body><main class="module-shell"><header class="module-head"><div><a href="./central.html" class="back">← Central operacional</a><div class="eyebrow">Comunicação empresarial</div><h1>CRM e conversas internas</h1><p id="company" class="muted">Carregando empresa…</p></div></header><div id="status" role="status" aria-live="polite" class="status"></div><div class="crm-layout"><section class="card"><h2>Conversas da empresa</h2><p class="muted">Notas privadas da equipe. Não envia mensagens pelo Instagram, e-mail ou WhatsApp.</p><form id="newThread"><label class="field">Assunto<input name="subject" minlength="3" maxlength="180" required></label><label class="field">Canal de referência<select name="channel"><option value="internal">Interno</option><option value="phone">Telefone</option><option value="email">E-mail</option><option value="instagram">Instagram</option></select></label><button class="btn primary" type="submit" style="margin-top:12px">Criar conversa</button></form><div id="threads" class="crm-list" style="margin-top:16px"></div></section><section class="card"><h2 id="threadTitle">Selecione uma conversa</h2><p id="threadInfo" class="muted">Mensagens visíveis somente aos membros autorizados da empresa.</p><div id="messages"></div><form id="messageForm" hidden><label class="field">Nova nota interna<textarea name="body" required maxlength="3000" rows="4"></textarea></label><button class="btn primary" type="submit" style="margin-top:12px">Registrar nota</button></form></section></div></main><script type="module" src="../assets/js/crm.js"></script></body></html>
