<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda | L&A Royal</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><main class="auth-wrap" style="max-width:1100px"><a href="./" class="eyebrow">← Painel</a><div class="card"><div class="card-head"><div><div class="eyebrow">Operação</div><h1>Agenda</h1></div><button id="newBtn" class="btn primary">Novo agendamento</button></div><div id="status" class="status"></div><div id="formBox" class="hidden"><form id="form" class="form-grid"><input type="hidden" id="id"><div class="field"><label>Cliente</label><select id="customer"></select></div><div class="field"><label>Serviço</label><select id="service"></select></div><div class="field"><label>Funcionário</label><select id="employee"></select></div><div class="field"><label>Início</label><input id="starts" type="datetime-local" required></div><div class="field"><label>Fim</label><input id="ends" type="datetime-local" required></div><div class="field"><label>Valor</label><input id="price" type="number" min="0" step="0.01"></div><div class="field full"><label>Observações</label><input id="notes"></div><div class="field full"><button class="btn primary">Salvar</button></div></form></div><div class="form-grid" style="margin:16px 0"><div class="field"><label for="agendaSearch">Buscar cliente, serviço ou funcionário</label><input id="agendaSearch" type="search" placeholder="Pesquisar agendamentos"></div><div class="field"><label for="agendaStatus">Situação</label><select id="agendaStatus"><option value="all">Todas</option><option value="pending">Pendentes</option><option value="completed">Concluídos</option><option value="cancelled">Cancelados</option></select></div><div class="field"><label for="agendaDate">Data</label><input id="agendaDate" type="date"></div><div class="field"><label for="agendaClear">Limpar filtros</label><button id="agendaClear" class="btn" type="button">Limpar filtros</button></div></div><p id="agendaCount" class="muted" aria-live="polite"></p><div class="table-wrap"><table class="data-table"><thead><tr><th>Data</th><th>Cliente</th><th>Serviço</th><th>Funcionário</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script type="module" src="../assets/js/agenda.js"></script></body></html>
