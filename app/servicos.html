<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serviços | L&A Royal</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><div class="module-shell"><header class="module-head"><div><a href="./index.html" class="back">← Painel</a><div class="eyebrow">Operação</div><h1>Serviços</h1><p id="company" class="muted"></p></div><button id="newBtn" class="btn primary">+ Novo serviço</button></header><div id="status" class="status"></div><section class="card"><div class="toolbar"><input id="search" placeholder="Buscar serviço"><select id="filter"><option value="all">Todos</option><option value="active">Ativos</option><option value="inactive">Inativos</option><option value="archived">Arquivados</option></select></div><div class="table-wrap"><table><thead><tr><th>Serviço</th><th>Preço</th><th>Duração</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></div><dialog id="modal" class="royal-modal"><form id="form" class="modal-card"><div class="modal-title"><h2 id="title">Novo serviço</h2><button type="button" id="close" class="icon-btn">×</button></div><input type="hidden" id="id"><div class="form-grid"><div class="field"><label>Nome</label><input id="name" required></div><div class="field"><label>Preço</label><input id="price" type="number" min="0" step="0.01" required></div><div class="field"><label>Duração em minutos</label><input id="duration" type="number" min="1" value="30" required></div><div class="field"><label>Status</label><select id="serviceStatus"><option value="active">Ativo</option><option value="inactive">Inativo</option></select></div><div class="field full"><label>URL da imagem</label><input id="image"></div><div class="field full"><label>Descrição</label><textarea id="description"></textarea></div></div><div class="modal-actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Salvar serviço</button></div></form></dialog><script type="module">import{getBusinessContext,listServices,saveService,archiveService}from'../assets/js/business.js';let ctx,items=[];const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),msg=(t,e=false)=>{status.textContent=t;status.className='status show '+(e?'error':'ok')};try{ctx=await getBusinessContext();company.textContent=ctx.tenant.name;if(!ctx.canManage)newBtn.classList.add('hidden');await load()}catch(e){msg(e.message,true)}async function load(){items=await listServices(ctx.tenant.id);render()}function render(){const q=search.value.toLowerCase(),f=filter.value,list=items.filter(x=>(f==='all'||x.status===f)&&x.name.toLowerCase().includes(q));rows.innerHTML=list.length?list.map(x=>`<tr><td><strong>${esc(x.name)}</strong><small>${esc(x.description||'')}</small></td><td>${money(x.price)}</td><td>${x.duration_minutes} min</td><td><span class="pill">${x.status}</span></td><td>${ctx.canManage?`<button class="mini" data-edit="${x.id}">Editar</button> <button class="mini danger" data-archive="${x.id}">Arquivar</button>`:''}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Nenhum serviço encontrado.</td></tr>'}function open(x={}){form.reset();id.value=x.id||'';name.value=x.name||'';price.value=x.price??'';duration.value=x.duration_minutes||30;image.value=x.image_url||'';description.value=x.description||'';serviceStatus.value=x.status==='inactive'?'inactive':'active';title.textContent=x.id?'Editar serviço':'Novo serviço';modal.showModal()}newBtn.onclick=()=>open();close.onclick=cancel.onclick=()=>modal.close();search.oninput=filter.onchange=render;rows.onclick=async e=>{const edit=e.target.dataset.edit,arc=e.target.dataset.archive;if(edit)open(items.find(x=>x.id===edit));if(arc&&confirm('Arquivar este serviço?')){try{await archiveService(ctx.tenant.id,arc);msg('Serviço arquivado.');await load()}catch(x){msg(x.message,true)}}};form.onsubmit=async e=>{e.preventDefault();try{await saveService(ctx.tenant.id,{id:id.value||null,name:name.value,price:price.value,duration_minutes:duration.value,image_url:image.value,description:description.value,status:serviceStatus.value});modal.close();msg('Serviço salvo com sucesso.');await load()}catch(x){msg(x.message,true)}};</script></body></html>
