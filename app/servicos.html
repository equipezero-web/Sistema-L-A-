<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serviços | L&A Royal</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><div class="module-shell"><header class="module-head"><div><a href="./index.html" class="back">← Painel</a><div class="eyebrow">Operação</div><h1>Serviços</h1><p id="company" class="muted"></p></div><button id="newBtn" class="btn primary">+ Novo serviço</button></header><div id="status" class="status"></div><section class="card"><div class="toolbar"><input id="search" placeholder="Buscar serviço"><select id="filter"><option value="all">Todos</option><option value="active">Ativos</option><option value="inactive">Inativos</option><option value="archived">Arquivados</option></select></div><div class="table-wrap"><table><thead><tr><th>Serviço</th><th>Preço</th><th>Duração</th><th>Loja</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></div><dialog id="modal" class="royal-modal"><form id="form" class="modal-card"><div class="modal-title"><h2 id="title">Novo serviço</h2><button type="button" id="close" class="icon-btn">×</button></div><input type="hidden" id="id"><input type="hidden" id="image"><div class="form-grid"><div class="field"><label>Nome</label><input id="name" required></div><div class="field"><label>Preço</label><input id="price" type="number" min="0" step="0.01" required></div><div class="field"><label>Duração em minutos</label><input id="duration" type="number" min="1" value="30" required></div><div class="field"><label>Status</label><select id="serviceStatus"><option value="active">Ativo</option><option value="inactive">Inativo</option></select></div><div class="field full"><label>Imagem do serviço</label><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"><small>PNG, JPG ou WEBP. Máximo 5 MB.</small><img id="imagePreview" alt="Prévia" style="display:none;max-width:140px;max-height:110px;object-fit:contain;margin-top:10px"></div><div class="field full"><label><input id="published" type="checkbox" style="width:auto"> Publicar este serviço na loja</label></div><div class="field full"><label>Descrição</label><textarea id="description"></textarea></div></div><div class="modal-actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary" type="submit">Salvar serviço</button></div></form></dialog><script type="module">import{getBusinessContext,listServices,saveService,archiveService,setServicePublished,uploadTenantAsset}from'../assets/js/business.js';
// Bind DOM controls explicitly: window.name, window.status and window.close are browser globals.
const ui = Object.fromEntries(["company","newBtn","status","search","filter","rows","modal","form","title","close","cancel","id","image","imagePreview","name","price","duration","imageFile","published","serviceStatus","description"].map(id => [id, document.getElementById(id)]));
let ctx,items=[];const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),msg=(t,e=false)=>{ui.status.textContent=t;ui.status.className='status show '+(e?'error':'ok')};try{ctx=await getBusinessContext();ui.company.textContent=ctx.tenant.name;if(!ctx.canManage)ui.newBtn.classList.add('hidden');await load()}catch(e){msg(e.message,true)}async function load(){items=await listServices(ctx.tenant.id);render()}function render(){const q=ui.search.value.toLowerCase(),f=ui.filter.value,list=items.filter(x=>(f==='all'||x.status===f)&&x.name.toLowerCase().includes(q));ui.rows.innerHTML=list.length?list.map(x=>`<tr><td><strong>${esc(x.name)}</strong><small>${esc(x.description||'')}</small></td><td>${money(x.price)}</td><td>${x.duration_minutes} min</td><td>${ctx.canManage?`<button class="mini" data-publish="${x.id}" data-value="${!x.published}">${x.published?'Publicada':'Privada'}</button>`:(x.published?'Publicada':'Privada')}</td><td><span class="pill">${x.status}</span></td><td>${ctx.canManage?`<button class="mini" data-edit="${x.id}">Editar</button> <button class="mini danger" data-archive="${x.id}">Arquivar</button>`:''}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Nenhum serviço encontrado.</td></tr>'}function showImage(u){ui.imagePreview.style.display=u?'block':'none';if(u)ui.imagePreview.src=u}function open(x={}){if(!ctx?.canManage)return;ui.form.reset();ui.id.value=x.id||'';ui.name.value=x.name||'';ui.price.value=x.price??'';ui.duration.value=x.duration_minutes||30;ui.image.value=x.image_url||'';ui.description.value=x.description||'';ui.published.checked=!!x.published;ui.serviceStatus.value=x.status==='inactive'?'inactive':'active';showImage(x.image_url);ui.title.textContent=x.id?'Editar serviço':'Novo serviço';ui.modal.showModal()}ui.newBtn.onclick=()=>open();ui.close.onclick=ui.cancel.onclick=()=>ui.modal.close();ui.search.oninput=ui.filter.onchange=render;ui.imageFile.onchange=()=>{const f=ui.imageFile.files[0];if(f)showImage(URL.createObjectURL(f))};ui.rows.onclick=async e=>{if(!ctx?.canManage)return;const edit=e.target.dataset.edit,arc=e.target.dataset.archive,pub=e.target.dataset.publish;if(edit)open(items.find(x=>x.id===edit));if(pub){try{await setServicePublished(ctx.tenant.id,pub,e.target.dataset.value==='true');msg('Publicação atualizada.');await load()}catch(x){msg(x.message,true)}}if(arc&&confirm('Arquivar este serviço?')){try{await archiveService(ctx.tenant.id,arc);msg('Serviço arquivado.');await load()}catch(x){msg(x.message,true)}}};ui.form.onsubmit=async e=>{e.preventDefault();const b=e.submitter||ui.form.querySelector('button[type="submit"]');try{if(!ctx?.canManage)throw new Error('Seu perfil não pode alterar o catálogo.');b.disabled=true;b.textContent='Salvando...';let url=ui.image.value||null;if(ui.imageFile.files[0]){msg('Enviando imagem...');url=await uploadTenantAsset(ctx.tenant.id,ui.imageFile.files[0],'services')}await saveService(ctx.tenant.id,{id:ui.id.value||null,name:ui.name.value,price:ui.price.value,duration_minutes:ui.duration.value,image_url:url,description:ui.description.value,status:ui.serviceStatus.value,published:ui.published.checked});ui.modal.close();msg('Serviço salvo com sucesso.');await load()}catch(x){msg(x.message,true)}finally{b.disabled=false;b.textContent='Salvar serviço'}};</script></body></html>
