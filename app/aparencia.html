<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aparência | L&A Royal SaaS</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="dashboard"><main class="dash-main" style="margin-left:0;max-width:1200px;margin:auto"><header class="dash-top"><div><div class="eyebrow">Minha Loja</div><h1>Aparência e publicação</h1></div><a class="btn" href="./index.html">← Painel</a></header><div id="status" class="status"></div><section class="dash-grid"><article class="dash-card"><h2>Identidade visual</h2><form id="themeForm" class="form-grid"><label class="field full">Logo da empresa<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><small>PNG, JPG, WEBP ou SVG. Máximo 5 MB.</small></label><input id="logoUrl" type="hidden"><label class="field">Cor principal<input id="primary" type="color"></label><label class="field">Cor secundária<input id="secondary" type="color"></label><label class="field">Fundo<input id="background" type="color"></label><label class="field">Texto<input id="textColor" type="color"></label><label class="field">Fonte<select id="font"><option>Inter</option><option>Poppins</option><option>Montserrat</option><option>Playfair Display</option><option>Roboto</option><option>Lato</option></select></label><label class="field">Layout<select id="layout"><option value="royal-classic">Royal Classic</option><option value="royal-modern">Royal Modern</option><option value="royal-minimal">Royal Minimal</option></select></label><label class="field full"><span><input id="published" type="checkbox" style="width:auto"> Loja publicada</span></label><div class="field full"><button class="btn primary" type="submit">Salvar aparência</button></div></form></article><article class="dash-card"><div class="eyebrow">Prévia</div><div id="preview" style="padding:28px;border-radius:20px;margin-top:12px;min-height:280px"><img id="previewLogo" alt="Logo" style="max-width:120px;max-height:90px;object-fit:contain;display:none"><h2 id="previewName">Sua empresa</h2><p>Esta prévia acompanha suas cores, fonte e layout.</p><button id="previewButton" class="btn" type="button">Ver catálogo</button></div><p><a id="publicLink" class="btn" target="_blank" rel="noopener">Abrir loja pública</a></p></article></section></main><script type="module" src="../assets/js/appearance.js"></script></body></html>
