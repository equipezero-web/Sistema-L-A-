<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loja | L&A Royal SaaS</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><main class="shell"><section class="hero"><div><div class="eyebrow">L&A Royal Store</div><h1 id="storeName">Carregando loja...</h1><p id="storeType"></p><p id="storeStatus" style="color:#9da3af"></p></div></section></main><script type="module">import{supabase}from'../assets/js/supabase.js';const params=new URLSearchParams(location.search),slug=params.get('slug'),nameEl=document.querySelector('#storeName'),typeEl=document.querySelector('#storeType'),statusEl=document.querySelector('#storeStatus');if(!slug){nameEl.textContent='Loja não informada';statusEl.textContent='Use um endereço de loja válido.'}else{const{data,error}=await supabase.from('saas_public_stores').select('name,business_type,primary_color,secondary_color,background_color,text_color,font_style,layout_id,logo_url').eq('slug',slug).maybeSingle();if(error||!data){nameEl.textContent='Loja indisponível';statusEl.textContent='Esta empresa não está publicada ou não foi encontrada.'}else{document.title=data.name;document.body.style.background=data.background_color;document.body.style.color=data.text_color;document.body.style.fontFamily=data.font_style+', Arial, sans-serif';nameEl.textContent=data.name;typeEl.textContent=data.business_type||'';typeEl.style.color=data.secondary_color;statusEl.textContent='Produtos e serviços publicados aparecerão aqui.'}}</script></body></html>
