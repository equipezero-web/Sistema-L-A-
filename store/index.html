<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loja | L&A Royal SaaS</title><link rel="stylesheet" href="../assets/css/main.css"><style>.store-head{padding:48px 0 28px}.store-logo{max-width:130px;max-height:90px;object-fit:contain}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:60px}.store-card{border:1px solid #9994;border-radius:18px;overflow:hidden;background:#fff1}.store-card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#0001}.store-card .body{padding:18px}.store-card h3{margin:0 0 8px}.store-card p{opacity:.72;min-height:42px}.store-card strong{font-size:1.25rem}.store-placeholder{width:100%;aspect-ratio:4/3;display:grid;place-items:center;background:#0001}.store-detail{display:block;margin-top:7px}.store-intro{max-width:680px;line-height:1.6;opacity:.86}.template-pill{display:inline-flex;padding:7px 14px;border-radius:99px;border:1px solid var(--gold);color:var(--gold);margin:12px 0;font-size:.8rem;font-weight:700}.template-note{font-size:.88rem;opacity:.8;margin:8px 0 24px}.store-head{position:relative}.store-head:before{content:"";position:absolute;inset:0 0 auto;z-index:-1;height:100%;background:radial-gradient(circle at 70% 10%,var(--gold),transparent 60%);opacity:.07;pointer-events:none}.catalog .store-card{transition:transform .2s ease,border-color .2s ease}.catalog .store-card:hover{transform:translateY(-3px);border-color:var(--gold)}body[data-template="barbershop"] .catalog{grid-template-columns:repeat(2,minmax(0,1fr));max-width:960px}body[data-template="barbershop"] .store-card img{aspect-ratio:16/9}body[data-template="barbershop"] .store-card .pill{color:var(--gold)}body[data-template="instagram_orders"] .catalog .store-card{border-color:var(--gold);background:linear-gradient(150deg,#143a6625,#0000)}body[data-template="virtual_store"] .catalog .store-card img{aspect-ratio:1/1}body[data-template="business_communication"] .store-head{max-width:680px;margin:0 auto;text-align:center;padding-top:90px}.pill{font-size:.72rem;padding:5px 9px;border:1px solid currentColor;border-radius:999px;opacity:.75}@media(max-width:800px){.catalog{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.catalog,body[data-template="barbershop"] .catalog{grid-template-columns:1fr}}
/* MOBILE SYSTEM v68: catalog templates (virtual store, instagram and fallback) */
#catalog,.catalog,.store-head,.store-card,.store-card .body{min-width:0}
.store-head h1,.store-card h3,.store-card p,.template-note,.store-intro{overflow-wrap:anywhere}
.store-card img{display:block;max-width:100%;height:auto}
@media(max-width:600px){
 .store-head{padding:clamp(24px,6vw,40px) 0 20px}
 .store-head h1{font-size:clamp(1.5rem,7.5vw,2.2rem);line-height:1.16}
 .store-head .btn{display:inline-flex;min-height:44px;white-space:normal;max-width:100%}
 .catalog{grid-template-columns:minmax(0,1fr);gap:12px;padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
 body[data-template="barbershop"] .catalog{grid-template-columns:minmax(0,1fr)}
 .store-card{border-radius:15px}
 .store-card .body{padding:clamp(12px,4vw,18px)}
 .store-card p{min-height:0}
 .store-logo{max-width:min(130px,45vw)}
}
@media(max-width:350px){
 .store-head{padding-top:20px}
 .store-head .btn{width:100%;justify-content:center}
 .store-card strong{font-size:1.1rem}
 .template-pill{max-width:100%;white-space:normal}
}

</style></head><body><main class="shell"><header class="store-head"><img id="logo" class="store-logo" hidden alt="Logo da empresa"><div class="eyebrow">L&A Royal Store</div><h1 id="storeName">Carregando loja...</h1><p id="storeType"></p><span class="template-pill" id="storeModelLabel" hidden></span><p class="store-intro" id="storeIntro"></p><p id="storeStatus"></p><p><a id="bookingLink" class="btn primary" hidden>Solicitar horário online</a></p><p class="template-note" id="templateNotice"></p></header><section id="catalog" class="catalog"></section></main><script>
window.__laPublicStoreSettled = false;
window.setTimeout(function () {
  if (window.__laPublicStoreSettled) return;
  var name = document.getElementById('storeName');
  var status = document.getElementById('storeStatus');
  if (name && name.textContent === 'Carregando loja...') {
    name.textContent = 'Loja temporariamente indisponível';
  }
  if (status) status.textContent = 'Não foi possível concluir o carregamento. Verifique sua conexão e atualize a página.';
}, 12000);
</script><script type="module">import { supabase } from '../assets/js/supabase.js';

const params = new URLSearchParams(location.search);
const slug = params.get('slug');
const nameEl = document.getElementById('storeName');
const typeEl = document.getElementById('storeType');
const statusEl = document.getElementById('storeStatus');
const catalogEl = document.getElementById('catalog');
const logoEl = document.getElementById('logo');
const modelLabel = document.getElementById('storeModelLabel');
const introEl = document.getElementById('storeIntro');
const noticeEl = document.getElementById('templateNotice');
const bookingLink = document.getElementById('bookingLink');
const publicModels = {
  barbershop: {
    badge:'BARBEARIA', intro:'Seu próximo atendimento começa aqui. Conheça os serviços, valores e duração de cada experiência.',
    notice:'Veja os serviços da barbearia. A experiência completa de agendamento está disponível no site principal da empresa.'
  },
  virtual_store: {
    badge:'LOJA VIRTUAL', intro:'Explore nossa seleção de produtos e encontre o que combina com você.',
    notice:'O pagamento e a finalização de compras na vitrine serão disponibilizados após a integração do checkout.'
  },
  instagram_orders: {
    badge:'PACOTES PARA INSTAGRAM', intro:'Consulte as opções disponibilizadas pela empresa, com preços e informações claras.',
    notice:'A geração de pedidos diretamente pelo site ainda está em integração. Nunca informe sua senha do Instagram.'
  },
  business_communication: {
    badge:'PORTAL EMPRESARIAL', intro:'Gestão de clientes, projetos e comunicação interna em um ambiente reservado aos integrantes autorizados.',
    notice:'O CRM e as conversas da equipe são privados e não aparecem publicamente.'
  }
};

const money = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, character =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]
  );
}
function safeImageUrl(value) {
  if (!value) return null;
  try {
    const url = new URL(value, location.href);
    return url.protocol === 'https:' ? url.href : null;
  } catch {
    return null;
  }
}
function renderItem(item) {
  const image = safeImageUrl(item.image_url);
  const imageMarkup = image
    ? '<img loading="lazy" src="' + escapeHtml(image) + '" alt="">'
    : '<div class="store-placeholder">Sem imagem</div>';
  const kind = item.item_type === 'product' ? 'Produto' : 'Serviço';
  const details = item.item_type === 'service' && item.duration_minutes
    ? '<small class="store-detail">' + escapeHtml(item.duration_minutes) + ' min</small>'
    : item.item_type === 'product' && !item.in_stock
      ? '<small class="store-detail">Indisponível</small>'
      : '';
  return '<article class="store-card">' + imageMarkup
    + '<div class="body"><span class="pill">' + kind + '</span>'
    + '<h3>' + escapeHtml(item.name) + '</h3>'
    + '<p>' + escapeHtml(item.description || '') + '</p>'
    + '<strong>' + money.format(Number(item.price || 0)) + '</strong>'
    + details + '</div></article>';
}

async function loadStore() {
  try {
    if (!slug || !/^[a-z0-9][a-z0-9-]{0,79}$/.test(slug)) {
      nameEl.textContent = 'Loja não informada';
      statusEl.textContent = 'Use um endereço de loja válido.';
      return;
    }

    const { data: store, error: storeError } = await supabase
      .from('saas_public_stores')
      .select('tenant_id,name,business_type,template_code,logo_url,primary_color,background_color,text_color,font_style')
      .eq('slug', slug)
      .maybeSingle();

    if (storeError) throw new Error('Não foi possível consultar a loja pública.');
    if (!store) {
      nameEl.textContent = 'Loja indisponível';
      statusEl.textContent = 'Esta empresa não está publicada ou não foi encontrada.';
      return;
    }

    // Select the company's original full client experience, not the generic catalog.
    // Other templates remain on the existing safe catalog until their backend adapters are ready.
    if (store.template_code === 'barbershop') {
      location.replace(new URL('./barbearia.html?slug=' + encodeURIComponent(slug), location.href).href);
      return;
    }

    document.title = store.name + ' | L&A Royal Store';
    document.body.style.background = store.background_color || '#FFFFFF';
    document.body.style.color = store.text_color || '#111111';
    document.body.style.fontFamily = (store.font_style || 'Inter') + ',Arial,sans-serif';
    document.documentElement.style.setProperty('--gold', store.primary_color || '#C9A227');
    const model = Object.prototype.hasOwnProperty.call(publicModels,store.template_code)
      ? store.template_code : 'generic';
    document.body.dataset.template = model;
    if(model==='barbershop') {
      bookingLink.href=new URL('./reservar.html?slug='+encodeURIComponent(slug),location.href).href;
      bookingLink.hidden=false;
    }
    const definition=publicModels[model];
    if (definition) {
      modelLabel.textContent=definition.badge;
      modelLabel.hidden=false;
      introEl.textContent=definition.intro;
      noticeEl.textContent=definition.notice;
    }
    if (model==='business_communication') {
      nameEl.textContent=store.name;
      typeEl.textContent=store.business_type || 'Comunicação empresarial';
      statusEl.textContent='Acesso restrito aos membros autorizados da empresa.';
      catalogEl.hidden=true;
      return;
    }
    nameEl.textContent = store.name;
    typeEl.textContent = store.business_type || '';
    if (safeImageUrl(store.logo_url)) {
      logoEl.src = safeImageUrl(store.logo_url);
      logoEl.hidden = false;
    }

    const { data: items, error: itemsError } = await supabase
      .from('saas_public_catalog_items')
      .select('item_type,name,description,price,image_url,duration_minutes,in_stock')
      .eq('tenant_id', store.tenant_id)
      .order('name');

    if (itemsError) throw new Error('Não foi possível carregar o catálogo.');
    if (!items?.length) {
      statusEl.textContent = 'Nenhum produto ou serviço publicado no momento.';
      return;
    }
    catalogEl.innerHTML = items.map(renderItem).join('');
    statusEl.textContent = items.length + ' item(ns) disponível(is)';
  } catch (error) {
    if (nameEl.textContent === 'Carregando loja...') nameEl.textContent = 'Loja temporariamente indisponível';
    statusEl.textContent = error?.message || 'Não foi possível carregar a loja. Atualize a página e tente novamente.';
    console.warn('Falha ao carregar a loja pública:', error);
  } finally {
    window.__laPublicStoreSettled = true;
  }
}

void loadStore();
</script></body></html>
